name: Quality

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Flutter and Android verification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app/android/**/*.gradle.kts
            app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;28.2.13676358"

      - name: Prepare dependencies
        working-directory: app
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          chmod +x android/gradlew
          flutter pub get --enforce-lockfile

      - name: Run Flutter tests
        working-directory: app
        run: flutter test --no-pub

      - name: Build unsigned ARM64 debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Run DroidDesk Android unit tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Enforce package-store architecture
        run: |
          python -m unittest tools.test_check_package_store_architecture -v
          python tools/check_package_store_architecture.py .

      - name: Enforce device-compatibility architecture
        run: |
          python -m unittest tools.test_check_device_compatibility_architecture -v
          python tools/check_device_compatibility_architecture.py .
